<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Portal | Triveda Broking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #0b0f19;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #f8fafc;
    }
    .card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 16px;
    }
    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    p.sub {
      color: #94a3b8;
      font-size: 13.5px;
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 13px 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }
    input::placeholder {
      color: #64748b;
    }
    select option {
      background: #0f172a;
      color: #ffffff;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    button:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }
    .token-box {
      display: none;
    }
    .token-display {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: #60a5fa;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(96, 165, 250, 0.25);
      border-radius: 14px;
      padding: 24px 0;
      margin: 20px 0;
      letter-spacing: 2px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: #facc15;
      font-size: 12px;
      font-weight: 600;
      margin-top: 14px;
    }
    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #facc15;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Check-In Form -->
    <div id="formView">
      <div class="badge">TRIVEDA BROKING</div>
      <h2>Visitor Check-In</h2>
      <p class="sub">Register your arrival to receive your visit token</p>

      <form id="checkInForm" onsubmit="handleCheckIn(event)">
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" id="companyName" placeholder="e.g. Acme Industries" required>
        </div>

        <div class="form-group">
          <label>Visitor Name</label>
          <input type="text" id="personName" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="mobileNumber" placeholder="10-digit number" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
          <label>Host / Telecaller</label>
          <select id="scheduledBy" required>
            <option value="" disabled selected>Select executive</option>
            <option value="FAIZ">FAIZ</option>
            <option value="RAHIM">RAHIM</option>
            <option value="REHMAN">REHMAN</option>
            <option value="NIKHIL">NIKHIL</option>
            <option value="DAKSH">DAKSH</option>
            <option value="AITAL">AITAL</option>
            <option value="MAHEK">MAHEK</option>
            <option value="DIRECT / WALK-IN">DIRECT / WALK-IN</option>
          </select>
        </div>

        <button type="submit" id="submitBtn">Generate Visitor Pass</button>
      </form>
    </div>

    <!-- Token Success View -->
    <div id="successView" class="token-box">
      <div class="badge">PASS ACTIVE</div>
      <h2>Welcome to Triveda</h2>
      <p class="sub">Your entry has been registered successfully</p>

      <div class="token-display" id="tokenOutput">---</div>

      <p style="color: #94a3b8; font-size: 13.5px; line-height: 1.5;">
        Please proceed to our visitor lounge. Your host has been notified of your arrival.
      </p>

      <div class="status-badge">Status: Waiting in Lobby</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEzD-ECgIhs0Eq2TXrudfNkn7KmeDDhC-hZ-Bvp-3w9XCYSYiCCiw6WkD18bpjEzMq/exec";

    function handleCheckIn(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.innerText = "Generating Pass...";
      btn.disabled = true;

      const payload = {
        companyName: document.getElementById("companyName").value.trim(),
        personName: document.getElementById("personName").value.trim(),
        mobileNumber: document.getElementById("mobileNumber").value.trim(),
        scheduledBy: document.getElementById("scheduledBy").value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById("formView").style.display = "none";
          document.getElementById("tokenOutput").innerText = data.token;
          document.getElementById("successView").style.display = "block";
        } else {
          throw new Error(data.message || "Failed");
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById("formView").style.display = "none";
        document.getElementById("tokenOutput").innerText = "PASS";
        document.getElementById("successView").style.display = "block";
      });
    }
  </script>

</body>
</html>
