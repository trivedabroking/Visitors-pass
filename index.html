<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Check-In | Triveda Broking</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .logo-badge {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 12px;
    }
    h2 {
      color: #111827;
      font-size: 22px;
      margin-bottom: 6px;
    }
    p.sub {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111827;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .token-box {
      display: none;
    }
    .token-display {
      font-size: 54px;
      font-weight: 800;
      color: #2563eb;
      background: #eff6ff;
      border: 2px dashed #bfdbfe;
      border-radius: 12px;
      padding: 20px 0;
      margin: 18px 0;
      letter-spacing: 2px;
    }
    .status-text {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
    }
    .status-pill {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 50px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Visitor Check-In Form -->
    <div id="formView">
      <div class="logo-badge">TRIVEDA BROKING</div>
      <h2>Visitor Check-In</h2>
      <p class="sub">Please enter your details to receive your token</p>

      <form id="checkInForm" onsubmit="handleCheckIn(event)">
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" id="companyName" placeholder="e.g. Acme Corp" required>
        </div>

        <div class="form-group">
          <label>Visitor Name</label>
          <input type="text" id="personName" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="mobileNumber" placeholder="e.g. 9876543210" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
        </div>

        <div class="form-group">
          <label>Scheduled By (Telecaller)</label>
          <select id="scheduledBy" required>
            <option value="" disabled selected>Select Telecaller</option>
            <option value="FAIZ">FAIZ</option>
            <option value="RAHIM">RAHIM</option>
            <option value="REHMAN">REHMAN</option>
            <option value="NIKHIL">NIKHIL</option>
            <option value="DAKSH">DAKSH</option>
            <option value="AITAL">AITAL</option>
            <option value="MAHEK">MAHEK</option>
            <option value="DIRECT / WALK-IN">DIRECT / WALK-IN</option>
          </select>
        </div>

        <button type="submit" id="submitBtn">Get Visitor Token</button>
      </form>
    </div>

    <!-- Token Success View -->
    <div id="successView" class="token-box">
      <div class="logo-badge">TRIVEDA BROKING</div>
      <h2>Welcome!</h2>
      <p class="sub">Your token number is</p>

      <div class="token-display" id="tokenOutput">---</div>

      <p class="status-text">Please take a seat in our reception lobby. Your host has been notified.</p>
      <div class="status-pill">Status: Waiting</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEzD-ECgIhs0Eq2TXrudfNkn7KmeDDhC-hZ-Bvp-3w9XCYSYiCCiw6WkD18bpjEzMq/exec";

    function handleCheckIn(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.innerText = "Generating Token...";
      btn.disabled = true;

      const payload = {
        companyName: document.getElementById("companyName").value.trim(),
        personName: document.getElementById("personName").value.trim(),
        mobileNumber: document.getElementById("mobileNumber").value.trim(),
        scheduledBy: document.getElementById("scheduledBy").value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById("formView").style.display = "none";
          document.getElementById("tokenOutput").innerText = data.token;
          document.getElementById("successView").style.display = "block";
        } else {
          throw new Error(data.message || "Failed to generate token");
        }
      })
      .catch(err => {
        console.error(err);
        alert("Submission completed! Please check with reception.");
        document.getElementById("formView").style.display = "none";
        document.getElementById("tokenOutput").innerText = "PASS";
        document.getElementById("successView").style.display = "block";
      });
    }
  </script>

</body>
</html>
